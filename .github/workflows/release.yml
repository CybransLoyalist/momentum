name: Build i wydanie

# Kazde wypchniecie na main tworzy nowe wydanie, ktore Obtainium widzi na telefonie.
# Bez ceremonii z tagowaniem - przy aplikacji dla jednej osoby to tylko przeszkadza.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Ustaw JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Odtworz klucz podpisujacy
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/momentum-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/momentum-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      # Obraz runnera nie musi miec najnowszej platformy, a Compose 1.12 wymaga API 37.
      # Taniej doinstalowac jawnie niz zgadywac, co akurat jest w obrazie.
      - name: Doinstaluj platforme Androida
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Ustal wersje
        id: wersja
        run: |
          echo "name=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Zbuduj APK
        run: |
          ./gradlew assembleRelease \
            -Pmomentum.versionName=${{ steps.wersja.outputs.name }} \
            -Pmomentum.versionCode=${{ steps.wersja.outputs.code }}

      - name: Nazwij plik
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "momentum-${{ steps.wersja.outputs.name }}.apk"

      - name: Opublikuj wydanie
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.wersja.outputs.name }}
          name: Momentum ${{ steps.wersja.outputs.name }}
          body: |
            Zbudowane z ${{ github.sha }}

            ${{ github.event.head_commit.message }}
          files: momentum-${{ steps.wersja.outputs.name }}.apk

      - name: Posprzataj klucz
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/momentum-release.jks"
